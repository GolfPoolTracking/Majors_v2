name: Field watch

# Checks the pinned tournament's field and emails the admin if it changed.
# field_watch.py does nothing (and makes no API call) unless entries close within WATCH_DAYS.
on:
  schedule:
    - cron: "17 3,12,17,22 * * *" 
  workflow_dispatch:           # "Run workflow" button in the Actions tab
    inputs:
      test_email:
        description: "Send me a test email (checks the API and email now, even outside the watch window)"
        type: boolean
        default: false
      watch_days:
        description: "WATCH_DAYS for this run only (leave blank to use the value in this file)"
        type: string
        default: ""

concurrency:
  group: field-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "supabase>=2.0,<3" "requests>=2.31,<3" "pytz>=2024.1"
      - run: python field_watch.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          TEST_EMAIL: ${{ inputs.test_email && 'true' || '' }}
          WATCH_DAYS: ${{ inputs.watch_days || '4' }}   # change the '4' to change the scheduled value
