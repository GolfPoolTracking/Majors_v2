name: Send emails

# Sends the mailing-list email queued on the admin page (📣 Mailing List tab).
# The admin page starts this workflow itself when the `github_token` Streamlit secret is set;
# otherwise press "Run workflow" here after queueing. With nothing queued it does nothing.
on:
  workflow_dispatch: {}

concurrency:
  group: send-emails
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "supabase>=2.0,<3" "pytz>=2024.1" "markdown>=3.5,<4"
      - run: python send_campaign.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
